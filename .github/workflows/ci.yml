name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        #os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        #python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: ["windows-latest"]
        python: ["3.15"]

    name: "Python ${{ matrix.python }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv run --python ${{ matrix.python}} bash script.sh
